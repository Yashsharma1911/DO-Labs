<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DigitalOcean Deploy London 2025</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
        }

        .container {
            text-align: center;
            max-width: 800px;
            padding: 2rem;
        }

        .header {
            margin-bottom: 2rem;
        }

        .title {
            font-size: 3.5rem;
            font-weight: 700;
            margin-bottom: 1rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .subtitle {
            font-size: 1.5rem;
            font-weight: 300;
            opacity: 0.9;
            margin-bottom: 2rem;
        }

        .region-info {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 2rem;
            margin: 2rem 0;
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .region-title {
            font-size: 1.8rem;
            margin-bottom: 1rem;
            color: #ffd700;
        }

        .region-details {
            font-size: 1.1rem;
            line-height: 1.6;
        }

        .region-flag {
            font-size: 4rem;
            margin-bottom: 1rem;
        }

        .navigation {
            margin-top: 3rem;
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .nav-button {
            background: rgba(255, 255, 255, 0.2);
            color: white;
            padding: 1rem 2rem;
            border: none;
            border-radius: 25px;
            text-decoration: none;
            font-size: 1.1rem;
            font-weight: 500;
            transition: all 0.3s ease;
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .nav-button:hover {
            background: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .footer {
            margin-top: 3rem;
            font-size: 0.9rem;
            opacity: 0.7;
        }

        @media (max-width: 768px) {
            .title {
                font-size: 2.5rem;
            }
            
            .subtitle {
                font-size: 1.2rem;
            }
            
            .container {
                padding: 1rem;
            }
            
            .navigation {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="title">DigitalOcean Deploy</div>
            <div class="subtitle">London 2025</div>
        </div>

        <div class="region-info">
            <div class="region-flag">🇬🇧</div>
            <div class="region-title">London Region</div>
            <div class="region-details">
                <p><strong>Region:</strong> London (lon1)</p>
                <p><strong>Location:</strong> United Kingdom</p>
                <p><strong>Deployment:</strong> Multi-region Global Load Balancer</p>
                <p><strong>Status:</strong> Active and Running</p>
            </div>
        </div>

        <div class="navigation">
            <a href="/arch" class="nav-button">View Architecture</a>
            <a href="/repo" class="nav-button">GitHub Repository</a>
        </div>

        <div class="footer">
            <p>Powered by DigitalOcean | Deployed with Terraform</p>
        </div>
    </div>

    <script>
        // Add some dynamic behavior
        document.addEventListener('DOMContentLoaded', function() {
            const container = document.querySelector('.container');
            
            // Add a subtle animation on load
            container.style.opacity = '0';
            container.style.transform = 'translateY(20px)';
            
            setTimeout(() => {
                container.style.transition = 'all 0.8s ease';
                container.style.opacity = '1';
                container.style.transform = 'translateY(0)';
            }, 100);

            // Add click handlers for navigation
            document.querySelectorAll('.nav-button').forEach(button => {
                button.addEventListener('click', function(e) {
                    if (this.href.endsWith('/repo')) {
                        e.preventDefault();
                        window.open('https://github.com/your-username/your-repo', '_blank');
                    }
                });
            });
        });
    </script>
</body>
</html>
